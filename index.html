<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="cache-control" content="no-cache">
<title>취향 유전자 지도 — 애독자 카드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;900&family=Noto+Serif+KR:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{--paper:#D9D9CE;--paper-2:#CFCFC2;--paper-3:#C6C6B8;--ink:#16182B;
  --ink-2:rgba(22,24,43,.78);--ink-3:rgba(22,24,43,.65);--line:rgba(22,24,43,.26);--line-2:rgba(22,24,43,.13);
  --pink:#FF3E96;--pink-fill:#E0257F;--pink-ink:#A3004F;--blue:#1B4FD8;--blue-ink:#12369A;
  --display:'Gothic A1',sans-serif;--body:'Noto Serif KR',serif;/* IBM Plex Mono 에는 한글 글리프가 없습니다. 지정하지 않으면 한글이 OS 기본 폰트로
     떨어져 맥과 윈도에서 다르게 보였습니다. 이미 불러오는 Gothic A1 으로 받게 합니다.
     숫자와 영문은 그대로 IBM Plex Mono(고정폭)를 씁니다. */
  --mono:'IBM Plex Mono','Gothic A1',ui-monospace,monospace}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.75;
  -webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:9;
  background-image:radial-gradient(var(--ink) .5px,transparent .6px);background-size:4px 4px;opacity:.08;mix-blend-mode:multiply}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px 96px;position:relative;z-index:1}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-family:var(--mono);font-size:11px;
  letter-spacing:.02em;padding:14px 0 12px;border-bottom:1.5px solid var(--ink);flex-wrap:wrap;color:var(--ink-2)}
.head b{font-weight:600;color:var(--ink)}.head .cnt{color:var(--pink-ink);font-weight:600}
/* 판걸림 오프셋이 크고 애니메이션이 걸려 있어 글자가 겹쳐 읽히지 않았습니다.
   3px 고정 · 애니메이션 제거 · 3줄 → 2줄 · 크기 축소로 잡았습니다. */
.mast{padding:38px 0 26px;border-bottom:5px double var(--ink)}
.mast h1{font-family:var(--display);font-weight:900;font-size:clamp(34px,6.4vw,74px);line-height:1.0;
  letter-spacing:-.035em;margin:0;position:relative;display:inline-block}
.mast h1 .plate{position:absolute;inset:0;color:var(--pink);z-index:-1;transform:translate(3px,3px)}
.mast .sub{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:20px 0 0}
.mast .lede{max-width:48ch;margin:12px 0 0;font-size:16px}
nav{display:flex;border-bottom:1.5px solid var(--ink);margin-bottom:34px;flex-wrap:wrap}
nav button{font-family:var(--display);font-weight:700;font-size:14.5px;background:none;border:0;
  border-right:1px solid var(--line-2);padding:15px 16px;cursor:pointer;color:var(--ink-2);position:relative}
nav button:hover{color:var(--ink);background:var(--paper-2)}
nav button[aria-selected=true]{background:var(--ink);color:var(--paper)}
nav button[aria-selected=true]::after{content:'';position:absolute;left:0;right:0;bottom:-1.5px;height:4px;background:var(--pink)}
nav button:disabled{opacity:.42;cursor:not-allowed}
nav button:focus-visible{outline:3px solid var(--pink-fill);outline-offset:-3px}
/* h2 24개가 전부 27px 이라 화면마다 봉우리가 없었습니다.
   그 화면이 존재하는 이유(.lead) / 일반 절 / 참고 자료(.sub) 세 단계로 나눕니다. */
h2{font-family:var(--display);font-weight:900;font-size:21px;letter-spacing:-.02em;margin:0 0 5px}
h2.lead{font-size:30px;letter-spacing:-.03em;margin-bottom:7px}
h2.sub{font-size:17px;color:var(--ink-2)}
.kicker{font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.04em;color:var(--pink-ink);margin:0 0 8px}
.note{font-size:14.5px;color:var(--ink-2);max-width:64ch}
.sect{margin-bottom:50px}.rule{border:0;border-top:1px solid var(--line);margin:26px 0}
.mono{font-family:var(--mono)}.num{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
label.fl{display:block;font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.02em;color:var(--ink-2);margin:0 0 7px}
input[type=text],textarea,select{width:100%;font-family:var(--body);font-size:15.5px;color:var(--ink);
  background:rgba(255,255,255,.55);border:1.5px solid var(--ink);border-radius:0;padding:11px 13px}
select{font-family:var(--mono);font-size:12.5px;width:auto;padding:8px 10px}
textarea{line-height:1.65;resize:vertical}
input[type=text]:focus,textarea:focus,select:focus{outline:0;border-color:var(--pink-fill);box-shadow:3px 3px 0 var(--pink-fill)}
.btn{font-family:var(--display);font-weight:700;font-size:14px;background:var(--ink);color:var(--paper);
  border:1.5px solid var(--ink);padding:11px 20px;cursor:pointer}
.btn:hover{background:var(--pink-fill);border-color:var(--pink-fill)}
.btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn.ghost{background:none;color:var(--ink)}.btn.ghost:hover{background:var(--ink);color:var(--paper)}
.btn.sm{font-size:12.5px;padding:7px 13px}.btn.on{background:var(--ink);color:var(--paper)}
/* 제출 버튼이 「시드 채우기」 같은 보조 버튼과 똑같이 생겨서 주 행동이 드러나지 않았습니다. */
.btn.go{font-size:17px;padding:15px 30px;background:var(--pink-fill);border-color:var(--pink-fill);
  box-shadow:5px 5px 0 var(--ink)}
.btn.go:hover{background:var(--ink);border-color:var(--ink);box-shadow:5px 5px 0 var(--pink-fill)}
.btn.go:active{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn:disabled:hover{background:var(--ink);border-color:var(--ink)}
.step{display:flex;gap:14px;align-items:flex-start;margin:0 0 12px}
.step .n{flex:none;width:29px;height:29px;border:1.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;
  font-family:var(--mono);font-weight:600;font-size:13px}
.step .n.done{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.step .n.now{background:var(--pink-fill);color:#fff;border-color:var(--pink-fill)}
/* 한 화면에 네 단계를 전부 펼쳐두니 읽을 것이 2,450자였습니다.
   한 번에 한 단계만 보여주고, 남은 거리를 계속 알려줍니다. */
.prog{border:1.5px solid var(--ink);background:rgba(255,255,255,.45);padding:14px 16px;margin-bottom:8px}
.prog .pt{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.prog .pn{font-family:var(--display);font-weight:900;font-size:19px}
.prog .pc{font-family:var(--mono);font-weight:600;font-size:12px;color:var(--ink-2)}
.prog .pbar{height:8px;background:var(--line-2);margin-top:11px;position:relative}
.prog .pbar i{position:absolute;inset:0 auto 0 0;background:var(--pink-fill);transition:width .35s ease}
.prog .ph2{font-size:13.5px;color:var(--ink-2);margin:10px 0 0}
.stp{border:1.5px solid var(--line);border-top:0;background:rgba(255,255,255,.22)}
.stp:first-of-type{border-top:1.5px solid var(--line)}
.stp.now{border-color:var(--ink);border-top:1.5px solid var(--ink);background:rgba(255,255,255,.5)}
.stp.now+.stp{border-top:0}
.stph{display:flex;gap:13px;align-items:center;width:100%;padding:15px 16px;background:none;border:0;
  cursor:pointer;text-align:left;font:inherit;color:inherit}
.stph:hover{background:var(--paper-2)}
.stph:focus-visible{outline:3px solid var(--blue);outline-offset:-3px}
.stp.now .stph{cursor:default}
.stp.now .stph:hover{background:none}
.stpn{flex:none;width:27px;height:27px;border:1.5px solid var(--line);border-radius:50%;display:grid;
  place-items:center;font-family:var(--mono);font-weight:600;font-size:12.5px;color:var(--ink-2)}
.stp.now .stpn{background:var(--pink-fill);color:#fff;border-color:var(--pink-fill)}
.stp.done .stpn{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.stpt{font-family:var(--display);font-weight:900;font-size:17px;line-height:1.25;color:var(--ink-2)}
.stp.now .stpt,.stp.done .stpt{color:var(--ink)}
.stps{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);margin-top:3px}
.stpe{margin-left:auto;font-family:var(--mono);font-weight:600;font-size:11px;color:var(--pink-ink);flex:none}
.stpb{display:none;padding:0 16px 20px}
/* 현재 단계만 펼칩니다. 요소는 그대로 두고 감추기만 해서 바인딩이 끊기지 않게 합니다. */
.stp.now>.stpb{display:block}
.stp.now{border-color:var(--ink);background:rgba(255,255,255,.55)}
.stp.now .stpn{background:var(--pink-fill);border-color:var(--pink-fill);color:#fff}
.stp.now .stpt{color:var(--ink);font-size:19px}
.stp.done .stpn{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.stp.done .stpt{color:var(--ink)}
.stp:not(.now) .stph:hover{background:var(--paper-2)}
.stp:not(.now) .stph:hover .stpt{color:var(--ink)}
.stph:focus-visible{outline:3px solid var(--blue);outline-offset:-3px}
.stp.now .stph{cursor:default}
.stp.now .stpb{display:block}
.nav2{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:24px;padding-top:18px;border-top:1px solid var(--line-2)}
.step h3{font-family:var(--display);font-weight:900;font-size:21px;margin:0 0 5px;line-height:1.25}
.step .d{font-size:14.5px;color:var(--ink-2)}
/* .warn 과 .hint 는 각각 한 번만 쓰이는 전용 스타일이었습니다.
   비슷한 무게의 안내 장치가 네 종류나 되면 어느 것이 중요한지 알 수 없습니다.
   평서(.note)와 강조(.how) 두 단계로 줄입니다. */
.warn{font-size:14.5px;color:var(--ink);max-width:60ch;border-left:4px solid var(--pink-fill);padding-left:13px;margin:12px 0 0}
.how{font-family:var(--mono);font-size:12px;color:var(--blue-ink);line-height:1.8;
  border-left:3px solid var(--blue);padding-left:12px;margin:14px 0 0;max-width:62ch}

.cv{aspect-ratio:2/3;overflow:hidden;position:relative;display:flex;align-items:flex-end;padding:5px}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* 본문에는 keep-all(단어 중간 줄바꿈 금지)이 맞지만, 46px 타일 안에서는
   「베르세르크」 다섯 글자가 한 줄에 못 들어가 잘려 나갔습니다.
   좁은 라벨에서는 음절 단위로 접히게 풀어줍니다. */
.cv .tt{font-family:var(--display);font-weight:900;line-height:1.24;letter-spacing:-.02em;
  word-break:break-all;overflow-wrap:anywhere;position:relative;max-height:100%;overflow:hidden}
.cv.k0{background:var(--ink);color:var(--paper)}.cv.k1{background:var(--pink-fill);color:#fff}
.cv.k2{background:var(--blue);color:#fff}.cv.k3{background:var(--paper-3);color:var(--ink)}
.cv.k4{background:var(--ink);color:var(--pink)}
.cv.has .tt{display:none}

.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:14px;margin-top:16px}
.card{background:none;border:0;padding:0;cursor:pointer;text-align:left;font:inherit;color:inherit}
.card .b{border:1.5px solid var(--ink)}
.card .cv .tt{font-size:11px}
.card:hover .b{box-shadow:5px 5px 0 var(--pink)}
.card:focus-visible .b{outline:3px solid var(--blue);outline-offset:2px}
.card .t{font-size:12.5px;line-height:1.4;margin-top:7px;font-weight:600}
.card .m{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);margin-top:2px}
.badge{position:absolute;top:0;left:0;color:#fff;font-family:var(--mono);font-weight:600;font-size:10px;padding:2px 5px;letter-spacing:.02em;z-index:2}
.badge.kr{background:var(--blue)}.badge.uni{background:var(--pink-fill)}

.shelf{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:14px}
@media(max-width:600px){.shelf{grid-template-columns:repeat(5,1fr);gap:6px}}
.slot{position:relative}
.slot .b{border:1.5px solid var(--ink)}
.slot.empty .b{border:1.5px dashed var(--line);aspect-ratio:2/3;display:grid;place-items:center;
  font-family:var(--mono);font-weight:600;font-size:12px;color:var(--ink-3)}
.slot .cv .tt{font-size:11px}
.slot.auto .b{border-color:var(--blue)}
.slot .x{position:absolute;top:-9px;right:-9px;width:23px;height:23px;border-radius:50%;background:var(--ink);
  color:var(--paper);border:0;cursor:pointer;font-family:var(--mono);font-size:12px;line-height:1;z-index:3}
.slot .x:hover{background:var(--pink-fill)}
.slot .af{position:absolute;bottom:0;left:0;right:0;background:var(--blue);color:#fff;font-family:var(--mono);
  font-weight:600;font-size:10px;letter-spacing:.02em;text-align:center;padding:2px 0;z-index:2}
.slot .lbl{font-size:12px;line-height:1.35;margin-top:6px;width:100%;background:none;border:0;
  border-bottom:1px dotted var(--line);font-family:var(--body);color:var(--ink);padding:1px 0}
@media(max-width:600px){.slot .lbl{display:none}}

.tgroup{margin-top:20px}
.tgroup .gl{font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.02em;color:var(--ink-2);
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.tgroup .gl b{color:var(--pink-ink)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tag{font-family:var(--display);font-weight:700;font-size:13.5px;background:rgba(255,255,255,.3);border:1.5px solid var(--ink);
  padding:8px 13px;cursor:pointer;color:var(--ink)}
.tag[aria-pressed=true]{background:var(--pink-fill);border-color:var(--pink-fill);color:#fff}
.tag.mood[aria-pressed=true]{background:var(--blue);border-color:var(--blue)}
.tag:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.axis{margin-top:16px;border:1.5px solid var(--ink);background:rgba(255,255,255,.42)}
/* flex + wrap 이라 좁은 폭에서 「충격」이 아래로 떨어져 축이 깨졌습니다. 그리드로 고정합니다. */
/* 이전 머리띠는 「위로 | 마음이 따뜻해짐 ← → 마음이 부서짐 | 충격」 3칸이었는데,
   가운데 문구가 접히면서 좌우 라벨과 겹쳤습니다. 게다가 그 문구는 아래 칸 이름과 같은 말입니다.
   중복을 없애고, 기준작을 띠 안 양 끝으로 넣어 「맨 왼쪽」이 어느 칸인지 눈으로 이어지게 했습니다. */
.axis .abar{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:12px 14px 13px;
  border-bottom:1.5px solid var(--ink);align-items:start}
.axis .ax-r{justify-self:end;text-align:right}
/* 축의 양 극은 맥락일 뿐이고, 사용자가 실제로 판단에 쓰는 것은 아래 칸 이름입니다.
   이전에는 극이 17px 고딕 900 으로 칸 이름(11px)을 압도해 위계가 뒤집혀 있었습니다. */
.ax-t{display:block;font-family:var(--display);font-weight:700;font-size:13.5px;
  line-height:1;margin-bottom:11px;color:var(--ink-2)}
/* 기준작 두 편은 성격이 같은 한 쌍입니다. 표지가 없을 때 제목 해시로 색이 정해져
   한쪽만 형광 분홍이 되면서 「선택됨」처럼 읽혔습니다. 중립색으로 고정합니다. */
.ax-a{display:flex;gap:11px;align-items:center}
.ax-r .ax-a{flex-direction:row-reverse}
.ax-a>.b{width:52px;flex:none;border:1px solid var(--line)}
.ax-a .cv{background:var(--paper-3)!important;color:var(--ink)!important}
.ax-a .cv .tt{font-size:9.5px;line-height:1.15}
.ax-a .cap{line-height:1.3}
/* 「맨 왼쪽 기준」은 순수 한글입니다. 모노를 지정하면 글자는 Gothic A1, 공백은
   IBM Plex Mono(0.6em 고정폭)가 그려서 띄어쓰기만 두 배로 벌어집니다.
   한글만 있는 라벨은 처음부터 고딕으로 짭니다. */
.ax-a .cap em{display:block;font-style:normal;font-family:var(--display);font-weight:700;
  font-size:10.5px;letter-spacing:.01em;color:var(--pink-ink);margin-bottom:4px}
.ax-a .cap b{font-family:var(--display);font-weight:700;font-size:14px;color:var(--ink)}
/* 한국어 문장을 모노로 짜면 자간이 벌어져 읽기 어렵습니다. 문장은 본문 서체로. */
.zempty{padding:30px 18px;text-align:center;font-family:var(--body);font-size:14.5px;color:var(--ink-2);line-height:1.8}
@media(max-width:600px){.axis .abar{grid-template-columns:1fr;gap:12px}
  .axis .ax-r{justify-self:start;text-align:left}.ax-r .ax-a{flex-direction:row}}
.zones{display:grid;grid-template-columns:repeat(5,1fr)}
.z{border-right:1px solid var(--line-2);padding:10px 8px 14px;min-height:200px;position:relative}
.zones.slim .z{min-height:0;padding-bottom:10px}
.z:last-child{border-right:0}
.z.hot{background:rgba(224,37,127,.11);box-shadow:inset 0 0 0 2px var(--pink-fill)}
/* min-height 였어서 1줄 라벨과 2줄 라벨의 시작 높이가 달랐습니다. 고정 높이로 정렬합니다. */
/* 칸 이름이 이 화면에서 가장 중요한 글자입니다. 축 라벨보다 작지 않게 올립니다. */
.z .zl{font-family:var(--display);font-weight:700;font-size:12.5px;letter-spacing:-.01em;color:var(--ink);
  text-align:center;margin-bottom:10px;line-height:1.3;height:34px;
  display:flex;align-items:center;justify-content:center}
.z:first-child .zl,.z:last-child .zl{color:var(--pink-ink)}
.z .cnt{position:absolute;bottom:5px;right:7px;font-family:var(--mono);font-weight:600;font-size:11px;color:var(--ink-2)}
.z .zn{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tile{width:46px;flex:none;background:none;border:0;padding:0;cursor:grab;position:relative;touch-action:none}
.tile .b{border:1.5px solid var(--ink);pointer-events:none}
.tile .cv .tt{font-size:9.5px}
.tile.moved .b{border-color:var(--pink-fill);border-width:2.5px}
.tile.sel .b{box-shadow:0 0 0 3px var(--blue)}
.tile.lift{opacity:.28}
.tile:focus-visible .b{outline:3px solid var(--blue);outline-offset:2px}
#ghost{position:fixed;width:46px;z-index:40;pointer-events:none;opacity:.94;
  box-shadow:5px 6px 0 rgba(22,24,43,.3);transform:rotate(-3deg)}
#ghost .b{border:2px solid var(--ink)}#ghost .cv .tt{font-size:9.5px}
@media(max-width:620px){
  .z{padding:8px 4px 12px;min-height:182px}

const BUILD='08-07';
const norm=s=>(s||'').toLowerCase().replace(/[^a-z0-9가-힣]/g,'');
const D=DICT.map((r,i)=>({aid:'d:'+i,title:r[0],q:r[1],country:r[2],pop:r[3],mood:r[4],g:r[5]}));
const DIX={};D.forEach(w=>DIX[w.aid]=w);

function dictSearch(q){
  const n=norm(q);if(!n)return [];
  const hit=[],part=[];
  D.forEach(w=>{const a=norm(w.title),b=norm(w.q);
    if(a===n||b===n)hit.push(w);
    else if(a.includes(n)||(b&&b.includes(n)))part.push(w);});
  return hit.concat(part).slice(0,18);
}

/* ══ AniList — 있으면 표지를 얹고, 없어도 페이지는 그대로 동작합니다 ══ */
const API='https://graphql.anilist.co';
const MF=`id title{english romaji native} coverImage{large medium} countryOfOrigin popularity format`;
const san=s=>String(s).replace(/["\\]/g,'');
let NETOK=null;
async function gql(query){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},
    body:JSON.stringify({query})});
  if(r.status===429)throw new Error('AniList 요청 제한(429)');
  let j=null;try{j=await r.json();}catch(e){}
  if(j&&j.data)return j.data;
  throw new Error((j&&j.errors&&j.errors[0]&&j.errors[0].message)||('HTTP '+r.status));
}
/* 결과가 없을 때 오류가 아니라 빈 배열이 오도록 Page 를 씁니다.
   Media(search:) 를 별칭으로 묶으면 한 건만 어긋나도 data 전체가 null 이 됩니다. */
async function alSearch(qs){
  const q='query{'+qs.map((t,i)=>
    `m${i}:Page(perPage:1){media(search:"${san(t)}",type:MANGA,isAdult:false){${MF}}}`).join('\n')+'}';
  const d=await gql(q);
  return qs.map((_,i)=>{const p=d['m'+i],m=p&&p.media&&p.media[0];
    return m?{cover:(m.coverImage&&(m.coverImage.large||m.coverImage.medium))||'',
      english:m.title.english||'',romaji:m.title.romaji||'',native:m.title.native||'',
      title:m.title.english||m.title.romaji||'',country:m.countryOfOrigin||'',pop:m.popularity||0}:null;});
}
/* AniList 검색은 퍼지 매칭이라 엉뚱한 작품이 1등으로 올 수 있습니다.
   돌아온 제목이 검색어와 실제로 겹치는지 확인하고, 아니면 표지를 버립니다.
   영어 제목만 비교하면 「Shingeki no Kyojin → Attack on Titan」이 오탐되므로 romaji·native 까지 봅니다. */
function titleOk(q,variants){
  const a=norm(q);if(!a)return false;
  const vs=variants.filter(Boolean);
  const nv=vs.map(norm);
  if(nv.some(b=>b===a))return true;
  if(a.length<6)return false;
  if(nv.some(b=>b.length>=6&&(b.includes(a)||a.includes(b))))return true;
  const ta=(q.toLowerCase().match(/[a-z0-9]+/g)||[]).filter(t=>t.length>2);
  if(!ta.length)return false;
  return vs.some(t=>{const tb=(t.toLowerCase().match(/[a-z0-9]+/g)||[]);
    return ta.filter(x=>tb.includes(x)).length/ta.length>=0.6;});
}
async function alFree(q){
  const d=await gql(`query{Page(perPage:14){media(search:"${san(q)}",type:MANGA,sort:SEARCH_MATCH,isAdult:false){${MF}}}}`);
  return (d.Page.media||[]).filter(m=>m.format!=='NOVEL').map(m=>({
    aid:'a:'+m.id,title:m.title.english||m.title.romaji||m.title.native||'',
    cover:(m.coverImage&&(m.coverImage.large||m.coverImage.medium))||'',
    country:m.countryOfOrigin||'',alPop:m.popularity||0,g:''}));
}
/* AniList popularity → 인기등급. 한국 작품은 과소 집계되므로 기준을 낮춥니다. */
function popTier(p,c){
  const f=(c==='KR')?6:1,v=(p||0)*f;
  const T=[200000,120000,70000,40000,20000,10000,5000,2000,800];
  for(let i=0;i<T.length;i++) if(v>=T[i]) return i+1;
  return 10;
}

/* ══ 저장 · 환경 자동 감지 ══
   Vercel에서는 /api/club (Upstash Redis) 를 씁니다. 멤버마다 해시 필드가 따로라
   동시 제출이 서로를 덮어쓰지 않습니다.
   Claude 아티팩트 미리보기에서는 window.storage 로 떨어지고,
   둘 다 없으면 이 브라우저 안에서만 도는 체험 모드가 됩니다. */
const MEK='dna6:me';
let STORE='probing',MEMBERS=[],ME=null,CLUB=null,COVERS={};
const hasArt=()=>typeof window!=='undefined'&&window.storage&&typeof window.storage.get==='function';
async function api(body){
  const r=await fetch('/api/club',body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});
  if(!r.ok)throw new Error('api '+r.status);
  const j=await r.json();if(j.error)throw new Error(j.error);return j;
}
async function probeStore(){
  try{const j=await api();if(j&&j.ok){STORE='api';return;}}catch(e){}
  if(hasArt()){STORE='artifact';return;}
  STORE='local';
}
/* 사파리 시크릿 모드 등에서는 저장이 아예 막힙니다. 그러면 신원이 유지되지 않으니 알려줘야 합니다. */
let LSOK=true;
try{localStorage.setItem('dna6:probe','1');localStorage.removeItem('dna6:probe');}catch(e){LSOK=false;}
const lsGet=k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
async function artGet(k){try{const r=await window.storage.get(k,true);return r?JSON.parse(r.value):null}catch(e){return null}}
async function artSet(k,v){try{await window.storage.set(k,JSON.stringify(v),true);return true}catch(e){return false}}
const myId=()=>STORE==='artifact'?(lsGet(MEK)||{}).id||window.__me||null:(lsGet(MEK)||{}).id||null;
const setMyId=id=>{lsSet(MEK,{id});window.__me=id;};
async function loadAll(){
  if(STORE==='probing')await probeStore();
  if(STORE==='api'){
    const j=await api();
    MEMBERS=j.members||[];COVERS=j.covers||{};CLUB=j.club||null;
  }else if(STORE==='artifact'){
    MEMBERS=(await artGet('dna6:members'))||[];
    COVERS=(await artGet('dna6:covers'))||{};
    CLUB=await artGet('dna6:club');
  }else{
    MEMBERS=lsGet('dna6:members')||[];COVERS=lsGet('dna6:covers')||{};CLUB=lsGet('dna6:club');
  }
  const id=myId();ME=id?MEMBERS.find(m=>m.id===id)||null:null;
}
/* claim=false 는 남의 카드를 쓸 때(시드 생성) 씁니다.
   이전에는 항상 내 신원을 갱신해서, 시드를 채우면 마지막 시드가 「나」가 되어버렸습니다. */
async function saveMember(rec,claim){
  let ok=false;
  try{
    if(STORE==='api'){await api({type:'member',rec});ok=true;}
    else{const arr=MEMBERS.slice(),at=arr.findIndex(m=>m.id===rec.id);
      if(at>=0)arr[at]=rec;else arr.push(rec);
      ok=STORE==='artifact'?await artSet('dna6:members',arr):lsSet('dna6:members',arr);}
  }catch(e){ok=false;}
  if(ok){if(claim!==false)setMyId(rec.id);await loadAll();}
  return ok;
}
/* 한 번 받아온 표지는 클럽 공용으로 쌓입니다. 멤버가 늘면 재조회가 거의 사라집니다. */
async function cacheCovers(map){
  const add={};Object.entries(map).forEach(([k,v])=>{if(v&&!COVERS[k])add[k]=v;});
  if(!Object.keys(add).length)return;
  Object.assign(COVERS,add);
  try{
    if(STORE==='api')await api({type:'covers',map:add});
    else if(STORE==='artifact')await artSet('dna6:covers',COVERS);
    else lsSet('dna6:covers',COVERS);
  }catch(e){}
}
/* 서버 연결 전에 제출한 카드는 브라우저 안에만 남아 서버 목록에 없습니다.
   그대로 두면 본인 눈에 카드가 사라진 것처럼 보이므로, 찾아내서 올릴지 물어봅니다. */
function findOrphans(){
  if(STORE!=='api')return [];
  const loc=lsGet('dna6:members');
  if(!Array.isArray(loc))return [];
  return loc.filter(m=>m&&m.id&&Array.isArray(m.works)&&m.works.length===NEED
    &&!MEMBERS.some(x=>x.id===m.id));
}
async function wipeAll(key){
  try{
    if(STORE==='api')await api({type:'wipe',key:key||''});
    else if(STORE==='artifact'){await artSet('dna6:members',[]);await artSet('dna6:covers',{});}
    else{lsSet('dna6:members',[]);lsSet('dna6:covers',{});}
    try{localStorage.removeItem(MEK);}catch(e){}
    window.__me=null;return true;
  }catch(e){return false;}
}

/* ══ 집계 ══ */
let WORKS={},OWNERS={},MOODAGG={},IDF={},TIDF={},SIM={},PAIRC={};
function recompute(){
  const N=MEMBERS.length||1,cnt={},tcnt={};WORKS={};OWNERS={};MOODAGG={};
  MEMBERS.forEach(m=>{m.works.forEach(w=>{
    cnt[w.aid]=(cnt[w.aid]||0)+1;(OWNERS[w.aid]=OWNERS[w.aid]||[]).push(m);
    (MOODAGG[w.aid]=MOODAGG[w.aid]||[]).push(w.mood);
    const cur=WORKS[w.aid];
    if(!cur)WORKS[w.aid]={...w};
    else{if(!cur.cover&&w.cover)cur.cover=w.cover;if(!cur.pop&&w.pop)cur.pop=w.pop;}});
    m.tags.forEach(t=>tcnt[t]=(tcnt[t]||0)+1);});
  Object.keys(WORKS).forEach(a=>{if(COVERS[a]&&!WORKS[a].cover)WORKS[a].cover=COVERS[a];});
  IDF={};Object.keys(cnt).forEach(a=>IDF[a]={n:cnt[a],w:Math.log((N+1)/cnt[a])});
  TIDF={};TAGS.forEach(t=>TIDF[t]={n:tcnt[t]||0,w:Math.log((N+1)/Math.max(1,tcnt[t]||0))});
  const V={},T={};
  MEMBERS.forEach(m=>{const v={};let s=0;m.works.forEach(w=>{const x=IDF[w.aid].w;v[w.aid]=x;s+=x*x});
    V[m.id]={v,norm:Math.sqrt(s)||1e-9};
    const tv={};let ts=0;m.tags.forEach(t=>{const x=(TIDF[t]||{w:1}).w;tv[t]=x;ts+=x*x});
    T[m.id]={v:tv,norm:Math.sqrt(ts)||1e-9};});
  SIM={};
  for(let i=0;i<MEMBERS.length;i++)for(let j=i+1;j<MEMBERS.length;j++){
    const A=MEMBERS[i],B=MEMBERS[j];let dot=0;const sh=[];
    for(const a in V[A.id].v)if(V[B.id].v[a]!==undefined){dot+=V[A.id].v[a]*V[B.id].v[a];sh.push(a);}
    let td=0,tn=0;for(const t in T[A.id].v)if(T[B.id].v[t]!==undefined){td+=T[A.id].v[t]*T[B.id].v[t];tn++;}
    const s=0.65*(dot/(V[A.id].norm*V[B.id].norm))+0.35*(td/(T[A.id].norm*T[B.id].norm));
    sh.sort((a,b)=>IDF[b].w-IDF[a].w);
    SIM[A.id+'|'+B.id]=SIM[B.id+'|'+A.id]={s,shared:sh,tagN:tn};}
  PAIRC={};
  MEMBERS.forEach(m=>{const a=m.works.map(w=>w.aid).sort();
    for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++)PAIRC[a[i]+'~'+a[j]]=(PAIRC[a[i]+'~'+a[j]]||0)+1;});
}
const pair=(a,b)=>SIM[a+'|'+b]||{s:0,shared:[],tagN:0};
const neighbors=(id,k)=>MEMBERS.filter(m=>m.id!==id).map(m=>({m,...pair(id,m.id)})).sort((a,b)=>b.s-a.s).slice(0,k||1e9);
/* 가로 좌표 — 소유자들의 마음 값 평균. 분산이 크면 이견입니다. */
function moodStat(aid){
  const a=MOODAGG[aid]||[];if(!a.length)return {mean:3,sd:0,n:0};
  const mean=a.reduce((s,x)=>s+x,0)/a.length;
  const sd=Math.sqrt(a.reduce((s,x)=>s+(x-mean)*(x-mean),0)/a.length);
  return {mean,sd,n:a.length};
}
const xOf=aid=>(moodStat(aid).mean-3)/2;
/* 세로 좌표 — 인기등급 1~10 → +1(수면 위) ~ -1(심해) */
const yOf=aid=>{const w=WORKS[aid]||{};const t=w.pop||6;return 1-2*(Math.max(1,Math.min(10,t))-1)/9;};
const state=aid=>{const s=moodStat(aid);
  if(s.n<=1)return 'prov'; if(s.n>=3&&s.sd>=0.9)return 'dis'; return 'ok';};
const memberXY=m=>({x:m.works.reduce((s,w)=>s+xOf(w.aid),0)/m.works.length,
  y:m.works.reduce((s,w)=>s+yOf(w.aid),0)/m.works.length});
function myRarePairs(me){
  const a=me.works.map(w=>w.aid).sort(),out=[];
  for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){
    const k=a[i]+'~'+a[j];if(PAIRC[k]!==1)continue;
    out.push({a:a[i],b:a[j],pop:Math.min(IDF[a[i]].n,IDF[a[j]].n)});}
  return out.sort((x,y)=>y.pop-x.pop).filter(x=>x.pop>=2).slice(0,3);
}
function clusters(){
  if(MEMBERS.length<CLUSTER_MIN)return null;
  const K=Math.max(3,Math.min(6,Math.round(MEMBERS.length/6))),adj={},lab={};
  MEMBERS.forEach((m,i)=>{adj[m.id]=neighbors(m.id,K).filter(n=>n.s>0.06);lab[m.id]=i});
  for(let it=0;it<40;it++){let mv=false;
    for(const m of shuffle([...MEMBERS])){
      const t={};adj[m.id].forEach(n=>t[lab[n.m.id]]=(t[lab[n.m.id]]||0)+n.s);
      const b=Object.keys(t).sort((x,y)=>t[y]-t[x])[0];
      if(b!==undefined&&+b!==lab[m.id]){lab[m.id]=+b;mv=true;}}
    if(!mv)break;}
  const g={};MEMBERS.forEach(m=>(g[lab[m.id]]=g[lab[m.id]]||[]).push(m));
  return Object.values(g).filter(a=>a.length>=2).sort((a,b)=>b.length-a.length).map((mem,i)=>{
    const c={};mem.forEach(m=>m.works.forEach(w=>c[w.aid]=(c[w.aid]||0)+1));
    const core=Object.keys(c).filter(a=>c[a]>=2).sort((a,b)=>c[b]*IDF[b].w-c[a]*IDF[a].w).slice(0,3);
    const tc={};mem.forEach(m=>m.tags.forEach(t=>tc[t]=(tc[t]||0)+1));
    return {i,mem,core,name:Object.keys(tc).sort((a,b)=>tc[b]-tc[a]).slice(0,2).join(' × ')||'분류 미정',ids:new Set(mem.map(m=>m.id))};});
}
function badges(me){
  const N=MEMBERS.length,out=[];
  const uni=me.works.filter(w=>IDF[w.aid].n===1);
  if(uni.length)out.push({t:'유니콘',d:`${N}명 중 나만 등록: ${uni.length}편`,hot:true});
  const deep=me.works.filter(w=>yOf(w.aid)<0).length;
  if(deep>=5)out.push({t:'심해 잠수부',d:`수면 아래 작품 ${deep}편`,hot:true});
  const pio=me.works.filter(w=>IDF[w.aid].n>1&&!MEMBERS.some(o=>o.id!==me.id&&o.ts<me.ts&&o.works.some(x=>x.aid===w.aid)));
  if(pio.length)out.push({t:'개척자',d:`클럽 최초 등록: ${pio.length}편`});
  const first=me.works.filter(w=>(MOODAGG[w.aid]||[]).length===1);
  if(first.length)out.push({t:'첫 감상자',d:`마음을 처음 표시한 작품 ${first.length}편`});
  if(me.works.some(w=>w.aid.startsWith('c:')))out.push({t:'미등재 발굴',d:'사전에 없는 작품을 올렸습니다'});
  const cl=clusters();
  if(cl){const s=new Set(neighbors(me.id,8).map(n=>cl.findIndex(c=>c.ids.has(n.m.id))).filter(x=>x>=0));
    if(s.size>=3)out.push({t:'허브',d:'서로 다른 부족을 잇는 사람',hot:true});}
  if((me.blind||{}).best>=8)out.push({t:'감별사',d:`블라인드 최고 ${me.blind.best}정답`});
  return out;
}

/* ══ 표지 ══ */
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=s=>Math.round(s*100);
const hashk=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)%5};
function cover(w,cls){
  const c=w.cover||COVERS[w.aid]||'';
  return `<div class="b ${cls||''}"><div class="cv k${hashk(w.aid||w.title)}${c?' has':''}">
    ${c?`<img src="${esc(c)}" alt="" loading="lazy" onerror="this.closest('.cv').classList.remove('has');this.remove()">`:''}<span class="tt">${esc(w.ko||w.title)}</span></div></div>`;
}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3200);}
const disp=w=>w.ko||w.title;

/* ══ 슬랙 문장 ══ */
const P='취향 유전자 지도';
const nameOf=m=>(m.slack?'@'+m.slack.replace(/^@/,''):m.name);
const sl=(...l)=>l.filter(x=>x!==null&&x!==undefined).join('\n');
/* 「중층」「얕은 물」은 제가 만든 말이라 뜻이 전달되지 않고, 인기등급 자체가 아직
   추정값이라 숫자를 밝히지 않습니다. 지도에서 눈으로 보이는 두 구역만 씁니다. */
const depthOf=aid=>yOf(aid)>=0?'수면 위':'수면 아래';
const txtDefend=(t,aid)=>sl(`${nameOf(t)} 님께 *변론 요청*`,'',
  `*${disp(WORKS[aid])}* — 클럽 ${MEMBERS.length}명 중 이걸 올린 사람은 ${t.name} 님 혼자입니다.`,'',
  '> 왜 이걸 인생작 열 편에 넣었습니까? 세 줄만 부탁합니다.','',`${P} · ${depthOf(aid)}`);
const txtOnlyDiff=(n,aid)=>sl(`${nameOf(n.m)} 님, 우리 *${pct(n.s)}% 닮았는데* 이 한 편이 갈렸습니다.`,'',
  `*${disp(WORKS[aid])}* — ${n.m.name} 님 목록에만 있습니다.`,
  n.shared.length?`겹친 건 ${n.shared.length}편: ${n.shared.slice(0,3).map(a=>disp(WORKS[a])).join(', ')}`:null,'',
  '> 취향이 이만큼 같은데 이건 왜 갈렸을까요. 이거 왜 골랐어요?','',P);
const txtRarePair=p=>sl(`클럽 ${MEMBERS.length}명 중 *이 조합은 저 혼자입니다.*`,'',
  `*${disp(WORKS[p.a])}* + *${disp(WORKS[p.b])}*`,'',
  `따로 보면 각각 ${IDF[p.a].n}명, ${IDF[p.b].n}명이 올린 작품입니다. 그런데 둘을 같은 열 편에 넣은 사람은 없습니다.`,'',
  '> 이게 왜 한 목록에 있는지 설명해보겠습니다.','',P);
const txtDispute=aid=>{const s=moodStat(aid);
  return sl(`*이 작품의 자리를 두고 갈립니다.*`,'',`*${disp(WORKS[aid])}* — ${s.n}명이 표시했고 평균은 「${ZP[Math.round(s.mean)-1]}」입니다.`,'',
    `그런데 편차가 커서 지도에서 점선으로 떠 있습니다. 누구는 데워진다고, 누구는 부서진다고 했습니다.`,'',
    '> 이 작품 읽고 나서 어떤 마음이었습니까?','',P);};
const txtRival=n=>sl(`*반대편 매칭* — ${nameOf(n.m)} 님과 저는 지금 클럽에서 가장 먼 두 사람입니다.`,'',
  `겹치는 작품 ${n.shared.length}편 · 겹치는 취향 축 ${n.tagN}개 · 일치도 ${pct(n.s)}%`,'',
  '> 서로 한 편씩 처방합시다. 완독하고 다시 이야기하는 조건으로.','',P);

async function copyText(t,btn){
  let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(e){}
  if(!ok){try{const ta=document.createElement('textarea');ta.value=t;
    ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);
    ta.focus();ta.select();ok=document.execCommand('copy');ta.remove();}catch(e){}}
  if(ok){const o=btn.textContent;btn.textContent='복사됨';setTimeout(()=>btn.textContent=o,1600);}
  else copyBox(t);
}

/* 클립보드 API 와 execCommand 가 모두 막히는 환경(모바일 웹뷰 등)의 마지막 수단.

function copyBox(t){
  const o=document.createElement('div');o.className='cbox';
  o.innerHTML=`<div class="cin"><p class="cmsg">이 환경에서는 자동 복사가 막혀 있습니다. 아래 글을 길게 눌러 전체 선택한 뒤 복사하세요.</p>
    <textarea rows="11"></textarea>
    <div style="display:flex;gap:10px;margin-top:12px;justify-content:flex-end"><button class="btn sm">닫기</button></div></div>`;
  document.body.appendChild(o);
  const ta=o.querySelector('textarea');ta.value=t;
  try{ta.focus();ta.setSelectionRange(0,t.length);}catch(e){}
  o.querySelector('button').onclick=()=>o.remove();
  o.addEventListener('click',e=>{if(e.target===o)o.remove();});
  document.addEventListener('keydown',function esc(e){if(e.key==='Escape'){o.remove();document.removeEventListener('keydown',esc);}});
}

async function shrink(file){
  const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(0);r.readAsDataURL(file);});
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(0);i.src=url;});
  const W=260,H=390,c=$('#px'),x=c.getContext('2d');c.width=W;c.height=H;
  const s=Math.max(W/img.width,H/img.height),w=img.width*s,h=img.height*s;
  x.fillStyle='#C6C6B8';x.fillRect(0,0,W,H);x.drawImage(img,(W-w)/2,(H-h)/2,w,h);
  return c.toDataURL('image/jpeg',0.72);}

    <div class="stpb">

그 아래 <b>⋯ (더보기) → Copy member ID</b> 로 아이디를 복사할 수 있습니다.
다만 여기에는 <b>평소 쓰는 표시 이름</b>(예: hyunwoo)을 적는 게 낫습니다.
멤버 ID를 붙여넣어도 슬랙에서 멘션이 걸리지 않고, 표시 이름이면 붙여넣은 뒤 @만 다시 쳐서 자동완성으로 부를 수 있습니다.</div></div></div>

      기기를 바꾸거나 브라우저 기록을 지우면, 그 링크가 내 카드를 되찾는 유일한 열쇠입니다.

    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;align-items:center">
      <button class="btn go" id="sub">${ME?'카드 수정':'카드 제출'}</button><span class="spin" id="ss"></span></div></div></div>
  ${ADMIN?`<hr class="rule">
  <section class="sect"><p class="kicker">운영자 화면</p><h2 class="sub">제출 현황</h2>
    <p class="note">마음 배치를 옮긴 사람이 적으면, 지도의 가로축이 아직 편집부 초기값이라는 뜻입니다.</p>
    <div class="stats" style="border:1.5px solid var(--ink);margin-top:16px">
      <div><div class="v">${MEMBERS.length}</div><div class="k">제출 인원</div></div>
      <div><div class="v">${movedN}</div><div class="k">마음을 옮긴 사람</div></div>
      <div><div class="v">${MEMBERS.length?Math.round(movedN/MEMBERS.length*100):0}%</div><div class="k">마음 배치 참여율</div></div>
      <div><div class="v">${autoPct}%</div><div class="k">편집부 추천 칸</div></div></div>
    <div style="margin-top:20px">${proof('클럽 오픈 공지 · 채널에 붙이기',txtOpen())}</div>
    ${MEMBERS.length?`<div class="rank" style="margin-top:20px">${MEMBERS.slice().sort((a,b)=>b.ts-a.ts).map((m,i)=>{
      const mv=m.works.filter(w=>w.mood!==w.seedMood).length;
      return `<div class="row"><span class="r num" style="font-size:18px">${MEMBERS.length-i}</span>
        <div><div class="nm" style="font-size:16px">${esc(m.name)}${ME&&m.id===ME.id?' <span class="mono" style="font-size:11px;color:var(--pink-ink)">— 나</span>':''}</div>
        <div class="ev">${ago(m.ts)} · 마음 ${mv}편 옮김 · 편집부 추천 ${m.works.filter(w=>w.auto).length}편</div></div>
        <span class="pc" style="font-size:13px">${esc((m.slack||'').replace(/^@/,'')||'—')}</span></div>`;}).join('')}</div>
      <div style="margin-top:20px">${proof('제출 현황 · 슬랙 독촉용',txtRoster())}</div>`
      :'<div class="empty" style="margin-top:18px"><p>아직 제출한 사람이 없습니다.</p></div>'}
    <hr class="rule">
    <p class="note" style="margin-bottom:12px">10명 미만이면 결과가 썰렁해서 첫인상을 망칩니다. 오픈 전에 시드를 채워두세요.</p>
    <div style="display:flex;gap:9px;flex-wrap:wrap">
      <button class="btn ghost sm" id="seed">시드 6명 채우기</button>
      <button class="btn ghost sm" id="wipe">전체 비우기</button></div>`:''}
    <p class="off" id="offmsg">표지는 없어도 페이지가 그대로 동작합니다. 사전에 ${D.length}편이 내장돼 있고, 표지만 AniList에서 받아옵니다.</p>
    <p class="off" id="stmsg"></p></section>`;

  const stm=$('#stmsg');
  if(stm)stm.innerHTML=STORE==='api'
    ?'저장 위치 — 클럽 공용 서버. 다른 멤버의 카드가 함께 보입니다.'
    :STORE==='artifact'
    ?'저장 위치 — 미리보기 저장소. 실제 운영은 배포된 주소에서 하세요.'
    :'<b style="color:var(--pink-ink)">저장 위치 — 이 브라우저 안에만 저장됩니다.</b> 다른 사람의 카드는 보이지 않는 체험 모드입니다. 서버가 연결되면 자동으로 공용 저장으로 바뀝니다.';
  const shelf=()=>{
    $('#shelf').innerHTML=Array.from({length:NEED},(_,i)=>{const w=draft.works[i];
      if(!w)return `<div class="slot empty"><div class="b">${i+1}</div></div>`;
      return `<div class="slot${w.auto?' auto':''}">${cover(w)}
        ${w.auto?'<span class="af">편집부 추천</span>':''}
        <button class="x" data-rm="${i}" aria-label="빼기">×</button>
        <input class="lbl" data-lb="${i}" value="${esc(disp(w))}" aria-label="제목 고치기"></div>`;}).join('');
    $('#cw').textContent=draft.works.length;
    const n2=$('#n2msg');
    if(n2)n2.textContent=draft.works.length>=NEED?'열 편 다 찼습니다'
      :`${NEED-draft.works.length}편 남았습니다`;
    $('#shelf').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{draft.works.splice(+b.dataset.rm,1);shelf();zones();});
    $('#shelf').querySelectorAll('[data-lb]').forEach(i=>i.onchange=()=>{const w=draft.works[+i.dataset.lb];if(w)w.ko=i.value.trim()||w.title;zones();});
    zones();};
  const mst=()=>{const mv=draft.works.filter(w=>w.mood!==w.seedMood).length;
    $('#mst').textContent=dragS&&dragS.sel!==null&&draft.works[dragS.sel]
      ?`「${disp(draft.works[dragS.sel])}」 골랐습니다 — 옮길 칸을 누르세요`
      :`${draft.works.length}편 중 ${mv}편을 옮겼습니다 · 안 옮겨도 제출됩니다`;};
  const zones=()=>{
    if(!dragS)dragS={sel:null};
    const zEl=$('#zones');
    if(!draft.works.length){
      zEl.className='zones slim';
      zEl.innerHTML=`<div class="zempty" style="grid-column:1/-1">위에서 인생작을 채우면 표지가 여기에 나타납니다.</div>`;
      mst();return;}
    zEl.className='zones';
    zEl.innerHTML=ZL.map((l,zi)=>{
      const inz=draft.works.map((w,i)=>({w,i})).filter(x=>x.w.mood===zi+1);
      return `<div class="z" data-z="${zi+1}"><div class="zl">${l}</div><div class="cnt">${inz.length||''}</div>
        <div class="zn">${inz.map(x=>`<button class="tile${x.w.mood!==x.w.seedMood?' moved':''}${dragS.sel===x.i?' sel':''}"
          data-i="${x.i}" aria-label="${esc(disp(x.w))} — 현재 ${esc(ZP[x.w.mood-1])}">${cover(x.w)}</button>`).join('')}</div></div>`;}).join('');
    bindStrip();mst();};
  const zoneAt=(x,y)=>{const el=document.elementFromPoint(x,y);return el?el.closest('.z'):null;};
  const setMood=(i,z)=>{if(draft.works[i].mood!==z)draft.works[i].mood=z;};
  function bindStrip(){
    $('#zones').querySelectorAll('.z').forEach(z=>{
      z.onclick=()=>{if(dragS.sel===null)return;setMood(dragS.sel,+z.dataset.z);const k=dragS.sel;dragS.sel=null;zones();
        const el=$(`.tile[data-i="${k}"]`);if(el)el.focus();};});
    $('#zones').querySelectorAll('.tile').forEach(b=>{
      const i=+b.dataset.i;
      b.onkeydown=e=>{
        if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();
          setMood(i,Math.max(1,Math.min(5,draft.works[i].mood+(e.key==='ArrowRight'?1:-1))));
          zones();const el=$(`.tile[data-i="${i}"]`);if(el)el.focus();}
        else if(e.key==='Enter'||e.key===' '){e.preventDefault();dragS.sel=(dragS.sel===i?null:i);zones();
          const el=$(`.tile[data-i="${i}"]`);if(el)el.focus();}};
      b.addEventListener('pointerdown',e=>{if(e.button!==undefined&&e.button!==0)return;
        b.setPointerCapture(e.pointerId);dragS.d={i,id:e.pointerId,x0:e.clientX,y0:e.clientY,on:false,tile:b};});
      b.addEventListener('pointermove',e=>{const d=dragS.d;if(!d||d.id!==e.pointerId)return;
        if(!d.on&&Math.hypot(e.clientX-d.x0,e.clientY-d.y0)<6)return;
        if(!d.on){d.on=true;dragS.sel=null;
          const g=document.createElement('div');g.id='ghost';g.innerHTML=cover(draft.works[d.i]);
          document.body.appendChild(g);d.g=g;d.tile.classList.add('lift');}
        d.g.style.left=(e.clientX-23)+'px';d.g.style.top=(e.clientY-34)+'px';
        $('#zones').querySelectorAll('.z').forEach(z=>z.classList.remove('hot'));
        const z=zoneAt(e.clientX,e.clientY);if(z)z.classList.add('hot');});
      const end=e=>{const d=dragS.d;if(!d||d.id!==e.pointerId)return;dragS.d=null;dragS.upAt=Date.now();
        if(!d.on){dragS.sel=(dragS.sel===d.i?null:d.i);zones();const el=$(`.tile[data-i="${d.i}"]`);if(el)el.focus();return;}
        if(d.g)d.g.remove();d.tile.classList.remove('lift');
        $('#zones').querySelectorAll('.z').forEach(z=>z.classList.remove('hot'));
        const z=zoneAt(e.clientX,e.clientY);if(z)setMood(d.i,+z.dataset.z);
        zones();const el=$(`.tile[data-i="${d.i}"]`);if(el)el.focus();};
      b.addEventListener('pointerup',end);b.addEventListener('pointercancel',end);
      /* 일부 보조기기·구형 브라우저는 pointer 이벤트 없이 click 만 보냅니다.
         pointerup 직후의 click 은 중복이므로 무시하고, 그 밖의 click 은 탭으로 처리합니다. */
      b.addEventListener('click',()=>{
        if(Date.now()-(dragS.upAt||0)<400)return;
        dragS.sel=(dragS.sel===i?null:i);zones();
        const el=$(`.tile[data-i="${i}"]`);if(el)el.focus();});});}
  shelf();

  const addWork=w=>{
    if(draft.works.length>=NEED)return toast('칸이 다 찼습니다. 빼고 넣으세요');
    if(draft.works.some(x=>x.aid===w.aid))return toast('이미 있습니다');
    draft.works.push({...w,seedMood:w.mood,note:w.note||'',blurb:'',auto:!!w.auto});shelf();};
  const results=list=>{
    if(!list.length){
      $('#sres').innerHTML=`<p class="note" style="margin-top:14px">사전에 없습니다. 아래 <b>직접 넣기</b>를 열어 제목을 채워뒀습니다.</p>`;
      const f=$('#foldCustom');f.open=true;$('#ct').value=$('#q').value.trim();
      f.scrollIntoView({behavior:'smooth',block:'center'});$('#ct').focus();return;}
    $('#sres').innerHTML=`<div class="res">${list.map((m,i)=>`<button class="card" data-add="${i}">
      ${cover(m)}<div class="t">${esc(disp(m))}</div>
      <div class="m">${m.country==='KR'?'한국 · ':''}${m.pop?'인기 '+m.pop+'급':'사전 밖'}</div></button>`).join('')}</div>`;
    $('#sres').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
      const before=draft.works.length;
      addWork(list[+b.dataset.add]);
      /* 넣는 데 성공했을 때만 검색창을 비웁니다. 칸이 찼거나 중복이면 결과를 남겨둡니다. */
      if(draft.works.length>before){$('#q').value='';$('#sres').innerHTML='';$('#q').focus();}});};
  const run=async()=>{const q=$('#q').value.trim();if(!q)return;
    let list=dictSearch(q);
    if(list.length<4&&NETOK!==false){
      $('#sres').innerHTML='<p class="spin" style="margin-top:16px">AniList에서 더 찾는 중…</p>';
      try{const extra=await alFree(q);NETOK=true;
        const have=new Set(list.map(w=>norm(w.title)));
        extra.forEach(m=>{const d=byTitle[norm(m.title)];
          if(d){if(!have.has(norm(d.title))){have.add(norm(d.title));list.push({...d,cover:m.cover});}}
          else list.push({...m,pop:popTier(m.alPop,m.country),mood:3});});
        cacheCovers(Object.fromEntries(list.filter(w=>w.cover).map(w=>[w.aid,w.cover])));
      }catch(e){NETOK=false;$('#offmsg').textContent='AniList에 연결되지 않아 내장 사전만 씁니다: '+e.message;}}
    results(list.slice(0,18));};
  $('#go').onclick=run;$('#q').onkeydown=e=>{if(e.key==='Enter')run();};

  let upCover='';
  $('#cf').onchange=async e=>{const f=e.target.files[0];if(!f)return;
    try{upCover=await shrink(f);$('#cpv').innerHTML=`<img src="${upCover}" alt="">`;}catch(err){toast('이미지를 읽지 못했습니다');}};
  $('#cadd').onclick=()=>{
    const t=$('#ct').value.trim();if(!t)return toast('제목은 필수입니다');
    const aid='c:'+norm(t);if(draft.works.some(w=>w.aid===aid))return toast('이미 있습니다');
    addWork({aid,title:t,ko:'',cover:upCover,country:'KR',pop:+$('#cp2').value,mood:3,g:'',note:$('#cn').value.trim(),selfPop:true});
    $('#ct').value='';$('#cn').value='';$('#cf').value='';$('#cpv').innerHTML='';upCover='';};

  const tapTag=(btn,t,list,max,cntEl)=>{const on=draft.tags.includes(t);
    if(on)draft.tags=draft.tags.filter(x=>x!==t);
    else{if(draft.tags.filter(x=>list.includes(x)).length>=max)return toast(`이 줄은 ${max}개까지입니다`);draft.tags.push(t);}
    btn.setAttribute('aria-pressed',String(!on));$(cntEl).textContent=draft.tags.filter(x=>list.includes(x)).length;};
  $('#tg1').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{tapTag(b,b.dataset.g,GENRES,MAXG,'#gc');updPool();});
  $('#tg2').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>tapTag(b,b.dataset.m,MOODS,MAXM,'#mc'));

  /* 선택한 장르 풀이 열 편에 못 미치면 다른 장르로 메우지 않습니다.
     무작위로 채우면 서로 비슷한 목록이 인공적으로 뭉쳐 지도가 거짓말을 하기 시작합니다.
     좁은 장르를 고른 사람은 취향이 뚜렷한 사람이라, 나머지를 손으로 고르는 쪽이 데이터가 낫습니다. */
  const poolN=()=>{const seen=new Set();gsel().forEach(t=>D.filter(w=>w.g===t).forEach(w=>seen.add(w.aid)));return seen.size;};
  const updPool=()=>{const el=$('#as');if(!el)return;
    const g=gsel().length,c=poolN();
    if(!g){el.textContent='취향 축을 먼저 고르면 그 축으로 열 편을 뽑습니다';return;}
    el.textContent=c>=NEED?`선택한 장르에 ${c}편 있습니다`
      :`선택한 장르에 ${c}편뿐입니다 · 나머지 ${NEED-c}편은 직접 검색해서 채워주세요`;};
  updPool();
  $('#auto').onclick=()=>{
    const g=gsel();
    if(!g.length){toast('장르 축을 먼저 하나 이상 골라주세요');$('#tg1').scrollIntoView({behavior:'smooth',block:'center'});return;}
    const keep=draft.works.filter(w=>!w.auto),have=new Set(keep.map(w=>w.aid)),pick=[];
    const room=NEED-keep.length;
    const pools=g.map(t=>shuffle(D.filter(w=>w.g===t)));
    const rounds=Math.max(0,...pools.map(p=>p.length));
    for(let r=0;r<rounds&&pick.length<room;r++)
      for(const p of pools){if(pick.length>=room)break;
        const w=p[r];if(!w||have.has(w.aid))continue;have.add(w.aid);pick.push({...w,auto:true});}
    if(!pick.length){$('#as').textContent='선택한 장르에서 더 뽑을 작품이 없습니다. 직접 검색해서 채워주세요';return;}
    draft.works=keep.concat(pick.map(w=>({...w,seedMood:w.mood,note:'',blurb:''})));
    shelf();
    const short=NEED-draft.works.length;
    $('#as').textContent=short>0
      ?`${pick.length}편을 넣었습니다 · 선택한 장르에 작품이 모자라 ${short}편은 직접 골라주세요`
      :`${pick.length}편을 넣었습니다 · 마음에 안 드는 건 빼고 다시 눌러도 됩니다`;
    $('#auto').textContent='편집부에 다시 일임합니다';};

  /* 단계 이동. 완료한 단계는 머리를 눌러 언제든 되돌아갈 수 있습니다. */
  /* 앞 단계로는 자유롭게 돌아가고, 뒤 단계로는 사이 단계를 마쳐야 넘어갑니다.
     그러지 않으면 진행 바와 「다음」 버튼의 검증이 서로 어긋납니다. */
  v.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
    const n=+b.dataset.go; if(n===STEP)return;
    if(n>STEP){for(let k=STEP;k<n;k++)if(!stepOK(k)){toast(stepMsg(k));return;}}
    STEP=n; render(); window.scrollTo({top:0,behavior:'smooth'});});
  v.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{
    const n=+b.dataset.next;
    if(n===1&&!stepOK(1)){toast(gsel().length?'성향 축을 하나 이상 골라주세요':'장르 축을 하나 이상 골라주세요');return;}
    if(n===2&&!stepOK(2)){toast(`열 편을 채워주세요 (지금 ${draft.works.length}편)`);return;}
    STEP=n+1; render(); window.scrollTo({top:0,behavior:'smooth'});});
  const skq=$('#skq');
  if(skq)skq.onclick=()=>{const h=$('#skhelp');h.style.display=h.style.display==='none'?'':'none';};
  v.querySelectorAll('[data-claim]').forEach(b=>b.onclick=async()=>{
    const m=MEMBERS.find(x=>x.id===b.dataset.claim);if(!m)return;
    const t=prompt(`「${m.name}」 카드를 이어받습니다.\n\n확인을 위해 이름을 그대로 입력해주세요.`);
    if(t===null)return;
    if(t.trim()!==m.name){toast('이름이 다릅니다');return;}
    setMyId(m.id);draft=null;STEP=1;JUST=false;await loadAll();TAB='report';render();
    toast(`${m.name} 님의 카드를 되찾았습니다`);});
  $('#sub').onclick=async()=>{
    draft.name=$('#nm').value.trim();draft.decl=$('#dc').value.trim();draft.slack=$('#sk').value.trim();
    if(gsel().length<1)return toast('장르 축을 하나 이상 골라주세요');
    if(msel().length<1)return toast('성향 축을 하나 이상 골라주세요');
    if(draft.works.length<NEED)return toast(`인생작 ${NEED}편을 채워주세요 (현재 ${draft.works.length}편)`);
    if(!draft.name)return toast('이름을 적어주세요');
    /* 신원 연결이 끊긴 사람이 같은 이름으로 다시 내면 카드가 두 개 생기고
       집계가 이중으로 잡힙니다. 새로 만들지 않고 기존 카드를 이어받게 합니다. */
    let adopt=null;
    if(!ME){
      const dup=MEMBERS.find(m=>m.name===draft.name);
      if(dup){
        if(!confirm(`「${draft.name}」 이름으로 이미 카드가 있습니다.\n\n[확인] 그 카드를 이어받아 이번 내용으로 수정합니다.\n[취소] 다른 이름으로 내겠습니다.`))return;
        adopt=dup;}}
    $('#sub').disabled=true;$('#ss').textContent='제출 중…';
    const prev=ME?Object.fromEntries(ME.works.map(w=>[w.aid,w.blurb||''])):{};
    const rec={id:ME?ME.id:(adopt?adopt.id:Math.random().toString(36).slice(2,10)),name:draft.name,decl:draft.decl,slack:draft.slack,
      tags:[...draft.tags],works:draft.works.map(w=>({aid:w.aid,title:w.title,ko:w.ko||'',cover:w.cover||'',
        country:w.country||'',pop:w.pop||5,mood:w.mood||3,seedMood:w.seedMood||w.mood||3,g:w.g||'',
        note:w.note||'',blurb:w.blurb||prev[w.aid]||'',auto:!!w.auto,selfPop:!!w.selfPop})),
      insight:(ME||adopt||{}).insight||'',rival:!!(ME||adopt||{}).rival,blind:(ME||adopt||{}).blind||null,
      ts:(ME||adopt||{}).ts||Date.now()};
    const ok=await saveMember(rec);
    $('#sub').disabled=false;$('#ss').textContent='';
    if(!ok)return toast('저장이 실패했습니다');
    draft=null;STEP=1;JUST=true;TAB='report';render();toast('카드가 올라갔습니다');};

  /* 이전 필터는 w.q 를 봤는데 멤버 작품 레코드에는 q 필드가 저장되지 않아 항상 통과했습니다.
     그래서 검색어가 없는 작품을 한국어 제목으로 조회하고, 퍼지 매칭으로 나온 엉뚱한 표지를
     그대로 붙일 수 있었습니다. 사전을 직접 보고 판단하도록 바꿉니다. */
  $('#covers').onclick=async()=>{
    const cand=[],seen=new Set();let skip=0;
    /* 기준작(요츠바랑·베르세르크)은 아무도 등록하지 않으면 WORKS 에 없어서
       표지를 한 번도 받아오지 못했습니다. 목록에 강제로 넣습니다. */
    const anchors=[byTitle[norm(ANCHOR_L)],byTitle[norm(ANCHOR_R)]].filter(Boolean);
    anchors.concat(Object.values(WORKS)).concat(draft?draft.works:[]).forEach(w=>{
      if(seen.has(w.aid))return;seen.add(w.aid);
      if(w.cover||COVERS[w.aid])return;
      if(w.aid.startsWith('c:')){skip++;return;}                 // 직접 올린 작품은 조회하지 않습니다
      const d=DIX[w.aid];
      if(d){if(!d.q){skip++;return;}cand.push({aid:w.aid,q:d.q});}  // 사전에 검색어가 없으면 건너뜁니다
      else if(w.title)cand.push({aid:w.aid,q:w.title});});
    const msg=$('#cvmsg')||$('#offmsg')||{textContent:''};
    if(!cand.length)return toast(skip?`조회할 표지가 없습니다 · 검색어 없는 작품 ${skip}편은 직접 올려주세요`:'불러올 표지가 없습니다');
    msg.textContent=`표지 ${cand.length}건 조회 중…`;
    const map={};let fail=0,rej=0;
    for(let i=0;i<cand.length;i+=10){
      const part=cand.slice(i,i+10);
      try{const got=await alSearch(part.map(x=>x.q));NETOK=true;
        got.forEach((g,k)=>{if(!g||!g.cover)return;
          if(!titleOk(part[k].q,[g.english,g.romaji,g.native])){rej++;return;}
          map[part[k].aid]=g.cover;});
      }catch(e){fail++;NETOK=false;}
      await new Promise(r=>setTimeout(r,300));}
    await cacheCovers(map);
    const note=`표지 ${Object.keys(map).length}건을 받았습니다`
      +(rej?` · 제목이 어긋나 버린 결과 ${rej}건`:'')
      +(skip?` · 검색어 없어 건너뜀 ${skip}편`:'')
      +(fail?` · 실패한 묶음 ${fail}개`:'');
    render();
    const m2=$('#cvmsg');if(m2)m2.textContent=note;else toast(note);};

  const sd=$('#seed');
  if(sd)sd.onclick=async()=>{
    if(!confirm('가짜 카드 6장을 클럽에 넣습니다.\n\n오픈 전에 화면을 확인하는 용도입니다.\n실제 멤버가 쓰기 시작한 뒤 누르면 지도와 유사도가 오염됩니다.\n\n계속할까요?'))return;
    $('#seed').disabled=true;$('#ss').textContent='시드 만드는 중…';
    const pickBy=(gs,n)=>{const out=[],seen=new Set();
      gs.forEach(g=>shuffle(D.filter(w=>w.g===g)).slice(0,4).forEach(w=>{if(!seen.has(w.aid)&&out.length<n){seen.add(w.aid);out.push(w);}}));
      shuffle(D).forEach(w=>{if(out.length<n&&!seen.has(w.aid)){seen.add(w.aid);out.push(w);}});return out.slice(0,n);};
    const S=[
      ['서연','완결 안 난 건 못 참아',['다크 판타지','회귀·환생물','액션·배틀','고구마 감수','작화파']],
      ['도윤','스포츠물은 다 울면서 봄',['스포츠','학원·청춘','드라마','서사파','완결 몰아보기파']],
      ['하람','일상물 수집가',['일상·힐링','개그·코미디','오피스·직업물','작화파','완결 몰아보기파']],
      ['민재','어두운 것만 봅니다',['미스터리·스릴러','SF·아포칼립스','드라마','고구마 감수','서사파']],
      ['수아','로맨스 판타지 전문',['로맨스 판타지','회귀·환생물','로맨스','사이다 직행','실시간 연재파']],
      ['지호','소년만화 원리주의',['액션·배틀','헌터·게임 판타지','개그·코미디','사이다 직행','실시간 연재파']],
    ];
    for(const [name,decl,tags] of S){
      const gs=tags.filter(t=>GENRES.includes(t));
      const ws=pickBy(gs,NEED).map(w=>{
        const jitter=Math.random()<.35?(Math.random()<.5?-1:1):0;
        const mood=Math.max(1,Math.min(5,w.mood+jitter));
        return {aid:w.aid,title:w.title,ko:'',cover:COVERS[w.aid]||'',country:w.country,pop:w.pop,
          mood,seedMood:w.mood,g:w.g,note:'',blurb:'',auto:false,selfPop:false};});
      await saveMember({id:Math.random().toString(36).slice(2,10),name,decl,slack:'',tags,works:ws,
        insight:'',rival:Math.random()<.5,blind:null,ts:Date.now()-Math.round(Math.random()*8e7)},false);}
    await loadAll();$('#ss').textContent='';$('#seed').disabled=false;render();toast('시드가 들어갔습니다');};
  const wp=$('#wipe');
  if(wp)wp.onclick=async()=>{
    let key='';
    if(STORE==='api'){key=prompt('전체를 지웁니다. 운영자 키를 입력하세요.\n(Vercel 환경변수 ADMIN_KEY 값)')||'';if(!key)return;}
    else if(!confirm('클럽 기록을 전부 지웁니다. 계속할까요?'))return;
    const ok=await wipeAll(key);
    if(!ok)return toast('지우지 못했습니다. 운영자 키를 확인하세요');
    ME=null;CLUB=null;draft=null;await loadAll();render();toast('비웠습니다');};
}

/* ══ 아이스버그 배치도 ══ */
function drawMap(host,opt){
  const {aids:allAids,members:allMem,mine}=opt;
  /* 좁은 화면에서는 940 폭 viewBox 가 축소되면서 표지가 15px 로 찍혀 읽을 수 없었습니다.
     viewBox 를 좁히고 표지와 글자를 키우고 작품 수를 줄입니다.
     사분면 숫자는 표시된 것이 아니라 전체 작품으로 세서 사실이 바뀌지 않게 합니다. */
  const MOB=(typeof window!=='undefined'&&window.innerWidth?window.innerWidth:1024)<640;
  const CAP=MOB?22:60;
  let aids=allAids;
  if(allAids.length>CAP){
    const a1=allAids.filter(a=>mine.has(a));
    const a2=allAids.filter(a=>!mine.has(a)).sort((x,y)=>((IDF[y]||{n:0}).n)-((IDF[x]||{n:0}).n));
    aids=a1.concat(a2).slice(0,CAP);}
  let members=allMem||[];
  const myId0=ME?ME.id:null;
  if(MOB&&members.length>10)
    members=members.filter(m=>m.id===myId0).concat(members.filter(m=>m.id!==myId0).slice(0,9));
  /* 작품이 적을 때 캔버스는 그대로인데 표지만 작아서 여백이 96%였습니다.
     표지 크기와 캔버스 높이를 작품 수에 맞춰 밀도를 일정하게 유지합니다. */
  const NW=aids.length;
  const SC=MOB?(NW<=8?1.35:NW<=14?1.15:1):(NW<=12?1.9:NW<=20?1.5:NW<=32?1.25:1);
  const W=MOB?540:940;
  const H=MOB?(NW<=8?640:NW<=14?750:820):(NW<=12?580:NW<=24?640:NW<=40?700:770);
  const PAD=MOB?60:92;
  const FS=MOB?19:13,FS2=MOB?16:12,SW=MOB?5:4;
  /* 표시된 작품이 전부 내 것이면 분홍 테두리는 아무것도 구분하지 못합니다.
     등록자 수가 전부 같으면 표지 크기 차이도 정보가 없습니다. 둘 다 그때는 끕니다. */
  const mixed=aids.some(a=>!mine.has(a))&&aids.some(a=>mine.has(a));
  const owners=aids.map(a=>(IDF[a]||{n:1}).n);
  const sizeVaries=Math.max(...owners)>Math.min(...owners);
  const BOT=MOB?102:88;                 /* 하단 축 캡션 + 사분면 라벨 자리 */
  const TOPB=MOB?78:70;                 /* 상단 사분면 라벨 자리 */
  const cl2=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));

  /* 배치는 데이터에 따라 수렴이 어려울 때가 있습니다. 겹침이 남으면 표지를 조금 줄여
     다시 배치합니다. 위치의 뜻은 그대로 두고 크기만 양보하므로 겹침이 반드시 사라집니다. */
  let TW,TH,CW,CH,xL,xR,yTop,yBot,sx,sy,nodes,shrink=1,hit=0;
  for(let attempt=0;attempt<4;attempt++){
    TW=Math.round((MOB?66:50)*SC*shrink); TH=Math.round((MOB?99:75)*SC*shrink);
    /* 표지가 조금 겹쳐도 괜찮습니다. 완전히 떼어놓으려면 좌표를 크게 왜곡해야 하는데,
       지도의 뜻은 위치에 있으니 위치를 지키고 겹침을 허용합니다.
       한 축으로 60% 이상 떨어지게만 해서 어느 작품인지 알아볼 수 있는 선은 지킵니다. */
    /* 표지를 완전히 떼어놓으면 실제 좌표에서 멀어집니다. 살짝 겹치는 편이 위치가 정직합니다.
       충돌 상자를 표지의 72% 로 잡아 최대 28% 정도만 겹치게 둡니다. */
    CW=Math.round(TW*0.72); CH=Math.round(TH*0.72);
    yTop=TOPB+TH/2; yBot=H-BOT-TH/2; xL=PAD+TW/2; xR=W-PAD-TW/2;
    sx=v=>xL+(v+1)/2*(xR-xL);
    sy=v=>yBot-(v+1)/2*(yBot-yTop);
    /* 멤버가 적으면 여러 작품의 목표 좌표가 완전히 같아집니다. 모두를 한 점으로 당기면
       밀어내도 다시 모여 세로줄로 쌓이므로, 겹치는 무리에는 격자 자리를 미리 나눠줍니다.
       무리의 중심은 여전히 진짜 좌표이고, 화면 끝에서는 중심을 안쪽으로 당깁니다. */
    const raw=aids.map(a=>({a,rx:sx(xOf(a)),ry:sy(yOf(a))}));
    const bucket={};
    raw.forEach(n=>{const k=Math.round(n.rx/8)+'_'+Math.round(n.ry/8);(bucket[k]=bucket[k]||[]).push(n);});
    nodes=[];
    Object.values(bucket).forEach(g=>{
      if(g.length===1){nodes.push({a:g[0].a,ax:g[0].rx,ay:g[0].ry});return;}
      const cols=Math.ceil(Math.sqrt(g.length)),rows=Math.ceil(g.length/cols);
      const hw=(cols-1)/2*CW, hh=(rows-1)/2*CH;
      const cx0=(xL+hw<=xR-hw)?cl2(g[0].rx,xL+hw,xR-hw):(xL+xR)/2;
      const cy0=(yTop+hh<=yBot-hh)?cl2(g[0].ry,yTop+hh,yBot-hh):(yTop+yBot)/2;
      g.forEach((n,i)=>{const c=i%cols,r=Math.floor(i/cols);
        nodes.push({a:n.a, ax:cx0+(c-(cols-1)/2)*CW, ay:cy0+(r-(rows-1)/2)*CH});});});
    nodes.forEach(n=>{n.ax=cl2(n.ax,xL,xR);n.ay=cl2(n.ay,yTop,yBot);n.x=n.ax;n.y=n.ay;});
    /* 1단계: 원래 좌표로 당기면서 겹침 완화 */
    for(let it=0;it<150;it++){
      for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
        const A=nodes[i],B=nodes[j];let dx=B.x-A.x,dy=B.y-A.y;
        const ox=CW-Math.abs(dx),oy=CH-Math.abs(dy);
        if(ox>0&&oy>0){
          if(Math.abs(dx)<0.5&&Math.abs(dy)<0.5){dx=((i+j)%2?1:-1)*0.5;dy=0.5;}
          if((ox/CW)<(oy/CH)){const k=(dx>=0?1:-1)*ox*.34;A.x-=k;B.x+=k;}
          else{const k=(dy>=0?1:-1)*oy*.34;A.y-=k;B.y+=k;}}}
      /* 겹침을 허용했으므로 밀어낼 거리가 짧습니다. 원래 좌표로 더 세게 당겨
         표지가 실제 자리에 가깝게 놓이도록 합니다. */
      nodes.forEach(n=>{n.x+=(n.ax-n.x)*.12;n.y+=(n.ay-n.y)*.12;
        n.x=cl2(n.x,xL,xR);n.y=cl2(n.y,yTop,yBot);});}
    /* 2단계: 복원력 없이 겹침만 풀기. 흔들기를 패스 시작에 두어 항상 「풀기」로 끝냅니다. */
    hit=0;
    for(let pass=0;pass<4;pass++){
      if(pass>0)nodes.forEach(n=>{n.x+=(Math.random()-.5)*9;n.y+=(Math.random()-.5)*9;});
      for(let it=0;it<150;it++){
        hit=0;
        for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
          const A=nodes[i],B=nodes[j];let dx=B.x-A.x,dy=B.y-A.y;
          const ox=CW-Math.abs(dx),oy=CH-Math.abs(dy);
          if(ox>0&&oy>0){hit++;
            if(Math.abs(dx)<0.5&&Math.abs(dy)<0.5){dx=((i+j)%2?1:-1)*0.5;dy=0.5;}
            if((ox/CW)<(oy/CH)){const k=(dx>=0?1:-1)*ox*.5;A.x-=k;B.x+=k;}
            else{const k=(dy>=0?1:-1)*oy*.5;A.y-=k;B.y+=k;}}}
        nodes.forEach(n=>{n.x=cl2(n.x,xL,xR);n.y=cl2(n.y,yTop,yBot);});
        if(!hit)break;}
      if(!hit)break;}
    /* 겹침 자체는 허용하므로, 절반 가까이 가려지는 심한 경우에만 표지를 줄입니다.
       작은 겹침까지 없애려다 표지가 불필요하게 작아지던 문제를 막습니다. */
    let severe=0;
    for(let i=0;i<nodes.length&&!severe;i++)for(let j=i+1;j<nodes.length;j++){
      const A=nodes[i],B=nodes[j];
      const ox=Math.max(0,TW-Math.abs(A.x-B.x)), oy=Math.max(0,TH-Math.abs(A.y-B.y));
      if(ox*oy>TW*TH*0.40){severe++;break;}}
    if(!severe)break;
    shrink*=0.9;
  }
  const myId=ME?ME.id:null;
  const cx=sx(0),wl=sy(0);
  const q=[0,0,0,0];allAids.forEach(a=>{q[(xOf(a)>=0?1:0)+(yOf(a)>=0?2:0)]++;});
  const mem=(members||[]).map(m=>{const p=memberXY(m);return {m,x:sx(p.x),y:sy(p.y)};});
  const sz=a=>{if(!sizeVaries)return 1;
    const n=(IDF[a]||{n:1}).n,mx=Math.max(2,MEMBERS.length);
    return 0.8+Math.min(1,(n-1)/(mx*0.4))*0.45;};
  host.innerHTML=`<svg class="g" viewBox="0 0 ${W} ${H}" role="img" aria-label="작품 배치도">
  <defs><clipPath id="ct"><rect width="${TW}" height="${TH}"/></clipPath>
    <linearGradient id="dp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--blue)" stop-opacity=".02"/>
      <stop offset="1" stop-color="var(--blue)" stop-opacity=".14"/></linearGradient></defs>
  <rect x="${PAD-34}" y="${wl}" width="${W-(PAD-34)*2}" height="${(H-BOT+24)-wl}" fill="url(#dp)"/>
  <line x1="${cx}" y1="${TOPB-20}" x2="${cx}" y2="${H-BOT+24}" stroke="var(--ink)" stroke-width="1" stroke-dasharray="4 6" opacity=".28"/>
  <line x1="${PAD-34}" y1="${wl}" x2="${W-PAD+34}" y2="${wl}" stroke="var(--blue)" stroke-width="2"/>
  <text x="6" y="${wl-9}" font-family="IBM Plex Mono,monospace" font-size="${FS2}"
    font-weight="600" fill="var(--blue-ink)">수면선</text>
  <g font-family="IBM Plex Mono,monospace" font-size="${FS2}" font-weight="600" fill="var(--ink-2)">
    <text x="6" y="${TOPB-6}">메이저 ↑</text>
    <text x="6" y="${H-BOT+18}">마이너 ↓</text></g>

/* 범례에 정보가 없는 항목을 넣으면 읽는 사람이 의미를 찾느라 시간을 씁니다.
   1인 클럽에서는 「내 열 편」 구분도 표지 크기 차이도 존재하지 않으므로 그때는 뺍니다. */
function legendOpt(aids,mine,members,others){
  const owners=aids.map(a=>(IDF[a]||{n:1}).n);
  return {mixed:aids.some(a=>!mine.has(a))&&aids.some(a=>mine.has(a)),
    dis:aids.some(a=>state(a)==='dis'),prov:aids.some(a=>state(a)==='prov'),
    members:!!members,others:!!others,
    sizeVaries:owners.length>1&&Math.max(...owners)>Math.min(...owners)};
}
function mapLegend(o){
  o=o||{};
  const it=[];
  if(o.mixed)it.push('<span><i style="background:var(--paper-3);border-color:var(--pink-fill);border-width:2.5px"></i>내 열 편</span>');
  it.push('<span><i style="background:var(--paper-3)"></i>'+(o.mixed?'클럽의 작품':'등록된 작품')+'</span>');
  if(o.dis)it.push('<span><i style="background:var(--paper-3);border-style:dashed"></i>자리를 두고 이견</span>');
  if(o.prov)it.push('<span><i style="background:var(--paper-3);opacity:.6"></i>한 명만 표시</span>');
  const it2=[];
  if(o.members){it2.push('<span><i style="background:var(--pink-fill);border-radius:50%"></i>나</span>');
    if(o.others)it2.push('<span><i style="background:var(--blue);border-radius:50%"></i>다른 멤버 · 열 편의 무게중심</span>');}
  if(o.sizeVaries)it2.push('<span>표지가 클수록 클럽에서 많이 올린 작품</span>');
  return `<div class="legend">${it.concat(it2).join('')}</div>`;
}

/* ══ 카드 이미지 · 공유 링크 ══ */
/* 같은 URL을 브라우저가 CORS 없이 먼저 받아 캐시에 넣으면, 이후 CORS 요청이 그 응답을
   재사용하면서 거부됩니다. 그래서 3단으로 내려갑니다.
   ① 그대로 CORS 요청 ② 주소를 살짝 바꿔 새로 받기 ③ 우리 서버를 거쳐 같은 출처로 받기 */
function tryImg(src,cors){return new Promise(res=>{
  if(!src)return res(null);
  const i=new Image();
  if(cors)i.crossOrigin='anonymous';
  i.onload=()=>res(i);i.onerror=()=>res(null);
  i.src=src;});}
async function loadImg(src){
  if(!src)return null;
  if(src.startsWith('data:'))return await tryImg(src,false);   /* 직접 올린 표지는 오염되지 않습니다 */
  let im=await tryImg(src,true);                 if(im)return im;
  im=await tryImg(src+(src.includes('?')?'&':'?')+'cors=1',true); if(im)return im;
  if(STORE==='api'){im=await tryImg('/api/cover?u='+encodeURIComponent(src),false);if(im)return im;}
  return null;
}
function wrapT(x,t,max){const out=[];let l='';
  for(const c of String(t)){if(x.measureText(l+c).width>max){out.push(l);l=c;}else l+=c;}
  if(l)out.push(l);return out;}
async function drawCard(me,useImgs){
  if(document.fonts&&document.fonts.ready){try{await document.fonts.ready;}catch(e){}}
  const W=2160,H=2700,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const INK='#16182B',PINK='#FF3E96',PINKI='#A3004F',SOFT='rgba(22,24,43,.72)';
  x.fillStyle='#D9D9CE';x.fillRect(0,0,W,H);
  x.fillStyle='rgba(22,24,43,.10)';

     굵기가 튀었습니다. 숫자와 주소만 모노로 두고 한글은 고딕으로 통일합니다. */
  x.fillStyle=INK;x.font='700 34px "Gothic A1",sans-serif';
  x.fillText('애독자 카드 No. '+me.id.slice(0,6).toUpperCase(),M,M+30);
  x.textAlign='right';x.fillText('취향 유전자 지도 · 만화/웹툰',W-M,M+30);x.textAlign='left';
  rule(M+70);

  /* 이름 · 선언문 · 취향 축 */
  let y=M+218;
  x.font='900 162px "Gothic A1",sans-serif';
  x.fillStyle=PINK;x.fillText(me.name,M+9,y+8);x.fillStyle=INK;x.fillText(me.name,M,y);
  y+=52;
  if(me.decl){x.font='400 54px "Noto Serif KR",serif';x.fillStyle=SOFT;
    wrapT(x,'“'+me.decl+'”',W-M*2).slice(0,2).forEach(l=>{y+=72;x.fillText(l,M,y);});}
  y+=62;x.font='700 36px "Gothic A1",sans-serif';x.fillStyle=PINKI;
  const tl=wrapT(x,me.tags.join('  ·  '),W-M*2).slice(0,2);
  tl.forEach((l,i)=>x.fillText(l,M,y+i*48));
  y+=tl.length*48+30;

  /* 표지 열 장. 표지가 없을 때도 의도된 지면으로 보이게 제목을 크게 가운데 놓습니다. */
  const imgs=useImgs?await Promise.all(me.works.map(w=>loadImg(w.cover||COVERS[w.aid]||''))):me.works.map(()=>null);
  const cols=5,gap=28,cw=(W-M*2-gap*(cols-1))/cols,ch=cw*1.5;
  me.works.forEach((w,i)=>{const cx=M+(i%cols)*(cw+gap),cy=y+Math.floor(i/cols)*(ch+gap);
    x.fillStyle='#C6C6B8';x.fillRect(cx,cy,cw,ch);
    const im=imgs[i];
    if(im){const s=Math.max(cw/im.width,ch/im.height),iw=im.width*s,ih=im.height*s;
      x.save();x.beginPath();x.rect(cx,cy,cw,ch);x.clip();x.drawImage(im,cx+(cw-iw)/2,cy+(ch-ih)/2,iw,ih);x.restore();}
    else{
      x.save();x.beginPath();x.rect(cx,cy,cw,ch);x.clip();
      x.fillStyle=INK;x.font='900 46px "Gothic A1",sans-serif';x.textAlign='center';
      const L=wrapT(x,disp(w),cw-40).slice(0,6);
      const y0=cy+ch/2-(L.length-1)*30;
      L.forEach((l,k)=>x.fillText(l,cx+cw/2,y0+k*60));
      x.textAlign='left';x.restore();}
    x.strokeStyle=INK;x.lineWidth=4;x.strokeRect(cx,cy,cw,ch);});
  y+=ch*2+gap+84;

  /* 숫자 다섯 개. 1인 클럽에서 「—」로 비던 자리를 말로 채웁니다. */
  const N=MEMBERS.length,pp=memberXY(me);
  const deep=me.works.filter(w=>yOf(w.aid)<0).length;

    [pp.x>=0?'충격':'위로','마음이 기운 쪽'],
    [top?pct(top.s)+'%':'아직 없음','최고 일치'],[String(N)+'명','집계 인원']];
  /* 글자 수로 서체를 나누면 「충격」 같은 한글이 모노로 떨어져 시스템 폰트로 합성됩니다.
     숫자는 고정폭, 한글은 고딕으로 성격에 따라 나누고, 「1명」처럼 섞인 값은 쪼개서 그립니다. */

      x.font='900 '+(v.length>=4?46:58)+'px "Gothic A1",sans-serif';
      x.fillText(v,px,py);}};
  const sw=(W-M*2)/5;
  S.forEach(([vv,kk],i)=>{const sx2=M+i*sw;
    x.fillStyle=INK;drawVal(String(vv),sx2+6,y+106);
    x.font='700 31px "Gothic A1",sans-serif';x.fillStyle=SOFT;x.fillText(kk,sx2+6,y+156);});
  y+=248;

  /* 지도에서 내 자리 — 아래쪽 빈 공간을 뜻 있는 정보로 채웁니다 */
  x.fillStyle=PINK;x.fillRect(M,y-30,10,88);
  x.fillStyle=INK;x.font='900 44px "Gothic A1",sans-serif';
  x.fillText('지도에서 내 자리',M+34,y+6);
  x.font='400 38px "Noto Serif KR",serif';x.fillStyle=SOFT;
  x.fillText('무게중심은 '+(pp.y>=0?'수면 위':'수면 아래')+' · 마음은 '+(pp.x>=0?'충격':'위로')+' 쪽'
    +(deep?' · 수면 아래 작품 '+deep+'편':''),M+34,y+52);
  y+=152;

  /* 열 편 목록 */
  x.font='700 30px "Gothic A1",sans-serif';x.fillStyle=PINKI;
  x.fillText('인생작 열 편',M,y);
  y+=48;
  x.font='400 40px "Noto Serif KR",serif';x.fillStyle=INK;
  const LL=wrapT(x,me.works.map(w=>disp(w)).join(' · '),W-M*2).slice(0,3);
  LL.forEach((l,i)=>x.fillText(l,M,y+i*54));
  y+=LL.length*54+34;   /* 실제 줄 수만큼만 자리를 씁니다 */

  /* 배지 · 발행 정보 */
  const bd=badges(me).slice(0,4);
  x.font='700 36px "Gothic A1",sans-serif';let bx=M;
  bd.forEach(b=>{const bw=x.measureText(b.t).width+40;
    if(bx+bw>W-M)return;
    x.strokeStyle=INK;x.lineWidth=4;x.strokeRect(bx,y-46,bw,66);
    x.fillStyle=INK;x.fillText(b.t,bx+20,y);bx+=bw+16;});

  const FY=H-M-6;
  rule(FY-58,3);
  x.font='700 32px "Gothic A1",sans-serif';x.fillStyle=SOFT;
  x.fillText('만화·웹툰 인생작 열 편으로 그리는 클럽 지도',M,FY);
  x.font='400 32px "IBM Plex Mono",monospace';
  x.textAlign='right';
  /* Vercel 미리보기 주소(이름-해시-팀.vercel.app)는 지나치게 길어 지면을 해칩니다.
     정식 주소 꼴로 줄이고, 그래도 길면 글자를 줄여 맞춥니다. */
  let host='';

  host=host||'취향 유전자 지도';
  let fs2=32;
  x.font='400 '+fs2+'px "IBM Plex Mono",monospace';

async function exportCard(me){

  </section>

  <details class="fold" style="margin-bottom:50px">
    <summary>더 있습니다 — 조합 희귀도 · 반대편 매칭 · 카드 공개${dis.length?' · 논쟁 중인 작품':''}</summary>
    <div class="in">
      ${dis.length?`<section class="sect" style="margin-bottom:34px"><h2 class="sub">이 작품의 자리를 두고 갈립니다</h2>
        <div style="margin-top:16px">${dis.slice(0,3).map(a=>proof(`${disp(WORKS[a])} · ${moodStat(a).n}명`,txtDispute(a))).join('')}</div></section>`:''}
      <section class="sect" style="margin-bottom:34px"><h2 class="sub">이 조합은 처음 봅니다</h2>
        <p class="note">열 편을 두 개씩 짝지어 45가지 중, 둘을 함께 올린 사람이 나뿐인 조합입니다.</p>
        <div style="margin-top:16px">${rare.length?rare.map(p=>proof(`조합 희귀도 · 단독 ${p.pop}인 교차`,txtRarePair(p))).join('')
          :'<div class="empty"><p>아직 단독 조합이 없습니다. 멤버가 늘면 나타납니다.</p></div>'}</div></section>
      <section class="sect" style="margin-bottom:34px"><h2 class="sub">반대편 매칭</h2>
        <p class="note">취향이 정반대인 사람끼리의 교환. 스스로 켠 사람들끼리만 붙입니다.</p>
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px">
          <button class="btn${me.rival?'':' ghost'} sm" id="rv">${me.rival?'켜져 있습니다 · 끄기':'반대편 매칭 켜기'}</button>
          <span class="spin">자원자 ${MEMBERS.filter(m=>m.rival).length}명</span></div>
        ${me.rival?(rival?`<div style="margin-top:18px">${proof(`가장 먼 자원자 · 일치 ${pct(rival.s)}%`,txtRival(rival))}</div>`
          :'<div class="empty" style="margin-top:18px"><p>다른 자원자를 기다리는 중입니다.</p></div>'):''}</section>
      <section class="sect" style="margin-bottom:8px"><h2 class="sub">내 카드 소개 문장</h2>
        <div style="margin-top:16px">${proof('내 애독자 카드',txtCard(me))}</div></section>
    </div></details>`;

  const rv=$('#rv');
  if(rv)rv.onclick=async()=>{await saveMember({...me,rival:!me.rival});render();
    toast(me.rival?'반대편 매칭을 껐습니다':'반대편 매칭을 켰습니다');};
}

/* ── 블라인드 ── */
let BL=null;
function blindAgg(){
  const t={};MEMBERS.forEach(m=>Object.entries((m.blind||{}).log||{}).forEach(([mid,r])=>{
    t[mid]=t[mid]||{o:0,n:0};t[mid].n++;if(r==='o')t[mid].o++;}));
  return Object.entries(t).filter(([mid,x])=>x.n>=2&&MEMBERS.some(m=>m.id===mid))
    .map(([mid,x])=>({name:(MEMBERS.find(m=>m.id===mid)||{}).name||'?',rate:x.o/x.n,n:x.n}));}
function newRound(){const pool=MEMBERS.filter(m=>m.id!==ME.id);if(pool.length<2)return null;
  const t=pool[Math.floor(Math.random()*pool.length)];
  return {t,opts:shuffle([t,...shuffle(pool.filter(m=>m.id!==t.id)).slice(0,3)]),answered:false};}
function viewBlind(v){
  const agg=blindAgg(),b=ME.blind||{best:0,plays:0,log:{}};
  if(MEMBERS.length<3){v.innerHTML=`<section class="sect"><p class="kicker">잠김</p><h2 class="lead">블라인드 카드 맞히기</h2>
    <p class="note">선택지를 만들려면 나 말고 3명 이상이 필요합니다.</p>
    <div class="empty" style="margin-top:20px"><p class="lock">현재 ${MEMBERS.length}명</p></div></section>`;return;}
  if(!BL)BL={round:0,score:0,q:newRound(),log:{}};
  const done=BL.round>=10||!BL.q;
  v.innerHTML=`
  <section class="sect"><p class="kicker">새로 입력할 게 없는 게임</p><h2 class="lead">블라인드 카드 맞히기</h2>
    <p class="note">표지 열 장만 보고 누구 목록인지 맞힙니다. 이미 제출된 카드만으로 돌아갑니다.</p>
    <p class="score" style="margin-top:16px">${done?`끝 · ${BL.score} / ${BL.round}`:`${BL.round+1}번째 문제 · 현재 ${BL.score}정답`} &nbsp; 내 최고 ${b.best||0}/10</p></section>
  ${done?`<section class="sect"><div class="empty"><p>이번 판 ${BL.score} / ${BL.round} 정답입니다.</p>
      <button class="btn" id="again">다시 하기</button></div>
    ${agg.length?`<div style="margin-top:34px"><p class="kicker">누가 제일 안 들켰나</p><h2 class="sub">정답률</h2>
      <div class="rank" style="margin-top:18px">${agg.slice().sort((x,y)=>x.rate-y.rate).map((a,i)=>`
        <div class="row"><span class="r">${i+1}</span><div><div class="nm">${esc(a.name)}</div>
        <div class="ev">${a.n}번 출제 · 정답률 ${Math.round(a.rate*100)}%</div>
        <div class="bar"><i style="width:${Math.max(3,a.rate*100)}%"></i></div></div>
        <span class="pc">${Math.round(a.rate*100)}%</span></div>`).join('')}</div>
      <div style="margin-top:24px">${proof('블라인드 결과',txtBlind(ME,agg))}</div></div>`:''}</section>`
  :`<section class="sect"><div class="blind">${BL.q.t.works.map(w=>cover(w)).join('')}</div>
    <p class="note">누구의 열 편일까요.</p>
    <div class="opts" style="margin-top:16px">${BL.q.opts.map(o=>`<button data-g="${esc(o.id)}">${esc(o.name)}</button>`).join('')}</div></section>`}`;
  if(done){const ag=$('#again');if(ag)ag.onclick=()=>{BL=null;render();};
    if(BL.round>0&&!BL.saved){BL.saved=true;
      saveMember({...ME,blind:{best:Math.max(b.best||0,BL.score),plays:(b.plays||0)+1,log:{...(b.log||{}),...BL.log}}});}
    return;}
  v.querySelectorAll('[data-g]').forEach(btn=>btn.onclick=()=>{
    if(BL.q.answered)return;BL.q.answered=true;
    const ok=btn.dataset.g===BL.q.t.id;BL.log[BL.q.t.id]=ok?'o':'x';if(ok)BL.score++;
    v.querySelectorAll('[data-g]').forEach(x=>{x.disabled=true;
      if(x.dataset.g===BL.q.t.id)x.classList.add('ok');else if(x===btn)x.classList.add('no');});
    setTimeout(()=>{BL.round++;BL.q=BL.round>=10?null:newRound();render();},1100);});
}

/* 휴대폰을 돌리면 지도 치수 기준이 바뀌므로 640px 경계를 넘을 때만 다시 그립니다. */
let lastMob=(typeof window!=='undefined'&&window.innerWidth?window.innerWidth:1024)<640,rzT=null;
if(typeof window!=='undefined')window.addEventListener('resize',()=>{
  clearTimeout(rzT);rzT=setTimeout(()=>{
    const now=window.innerWidth<640;
    if(now!==lastMob){lastMob=now;if(ME||VIEW_ID)render();}},260);});

(async function(){
  $('#view').innerHTML='<p class="spin">클럽 기록을 불러오는 중…</p>';
  try{await loadAll();}catch(e){}
  /* ?me=<id> 는 전용 링크입니다. 기기를 바꿔도 이 링크로 들어오면 내 카드를 되찾습니다.
     주소에 남아 있으면 실수로 공유될 수 있으니 확인 후 지웁니다. */
  try{const qm=new URLSearchParams(location.search).get('me');
    if(qm&&MEMBERS.some(m=>m.id===qm)){setMyId(qm);ME=MEMBERS.find(m=>m.id===qm)||null;TAB='report';
      try{history.replaceState(null,'',location.pathname);}catch(e){}}}catch(e){}
  /* ?card=<id> 로 들어오면 그 사람의 카드를 보여줍니다. 슬랙에 링크를 뿌릴 때 쓰입니다. */
  try{const q=new URLSearchParams(location.search).get('card');
    if(q&&MEMBERS.some(m=>m.id===q)){VIEW_ID=q;TAB='report';}}catch(e){}
  if(!VIEW_ID&&ME)TAB='report';
  render();
})();
</script>
